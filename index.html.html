<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쭌이 잉글리쉬</title>
<style>
:root{--bg:#87ceeb;--grass:#5da130;--dirt:#8b5a2b;--card:#f4ecd8;--ink:#2b1d0e;--ok:#2e9e3f;--bad:#d64545;--gold:#f2b705;--stone:#7d7d7d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b2a4a;--grass:#4a8527;--dirt:#6f4722;--card:#e6dcc3;--gold:#d9a400}}
:root[data-theme="dark"]{--bg:#1b2a4a;--grass:#4a8527;--dirt:#6f4722;--card:#e6dcc3;--gold:#d9a400}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:12px}
.top{background:var(--grass);border:4px solid #000;border-bottom:12px solid var(--dirt);padding:14px;text-align:center;color:#fff;font-size:26px;font-weight:900;text-shadow:2px 2px 0 #000;margin-bottom:12px}
.box{background:var(--card);border:4px solid #000;padding:14px;margin:10px 0;text-align:center}
.b{display:block;width:100%;padding:16px;font:800 20px/1.2 inherit;font-family:inherit;border:4px solid #000;background:var(--stone);color:#fff;margin:10px 0;box-shadow:inset -4px -4px 0 rgba(0,0,0,.3),inset 4px 4px 0 rgba(255,255,255,.3);cursor:pointer;text-shadow:1px 1px 0 #000}
.b:active{transform:translateY(3px)}
.g{background:var(--ok)}.d{background:var(--dirt)}.y{background:var(--gold);color:#2b1d0e;text-shadow:none}.r{background:var(--bad)}
.row{display:flex;gap:10px}.row .b{margin:10px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:var(--card);border:4px solid #000;min-height:84px;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;font-weight:800;cursor:pointer;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.c.on{background:#cfe8b0}.c .en{font-size:24px;color:#1c5d10}
.c button{font-size:20px;border:3px solid #000;background:var(--gold);margin-top:4px;padding:2px 10px;cursor:pointer}
.ko{font-size:30px;font-weight:900;margin:8px 0}
.bl{font:900 34px/1.3 ui-monospace,Menlo,monospace;letter-spacing:6px;word-break:break-all;margin:10px 0}
input,textarea{width:100%;font-size:26px;padding:12px;border:4px solid #000;background:#fff;color:#000;font-family:inherit;text-align:center}
textarea{font-size:17px;text-align:left;height:260px}
.msg{min-height:34px;font-size:22px;font-weight:900}
.bar{display:flex;justify-content:space-between;font-weight:900;font-size:18px}
small{display:block;opacity:.8;line-height:1.5;margin:6px 0}
</style></head><body><div id="app"><div class="top">⛏️ 쭌이 잉글리쉬</div><div id="v"></div></div>
<script>
var DEF=[{k:"~ 근처에",e:"near"},{k:"철도",e:"railway"},{k:"다리",e:"bridge"},{k:"철로",e:"tracks"},{k:"증기 기관차",e:"steam train"},{k:"특별한",e:"special"},{k:"소음, 소리",e:"noise"},{k:"호루라기, 기적",e:"whistle"},{k:"선물",e:"present"},{k:"~ 할 때",e:"when"},{k:"하루 종일",e:"all day"},{k:"심지어",e:"even"},{k:"가장 좋아하는",e:"favourite",a:["favorite"]}];
var W=DEF,V=document.getElementById("v"),T={};
try{var s=JSON.parse(localStorage.getItem("jjuni_words")||"null");if(s&&s.length)W=s}catch(e){}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function say(t){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function home(){V.innerHTML='<div class="box">🌍 단어 '+W.length+'개 준비됐어!</div><button class="b g" onclick="study()">📖 공부하기</button><button class="b y" onclick="startTest(W)">✏️ 시험 보기</button><button class="b d" onclick="edit()">🧱 단어 바꾸기</button>'}
function study(){var h='<div class="box">카드를 누르면 영어가 나와요!</div><div class="grid">';W.forEach(function(w,i){h+='<div class="c" id="c'+i+'" onclick="flip('+i+')">'+esc(w.k)+'</div>'});V.innerHTML=h+'</div><button class="b" onclick="home()">🏠 처음으로</button>'}
function flip(i){var c=document.getElementById("c"+i),w=W[i];c.classList.add("on");c.innerHTML='<div class="en">'+esc(w.e)+'</div><button onclick="event.stopPropagation();say(W['+i+'].e)">🔊 듣기</button>';say(w.e)}
function startTest(list){T={q:shuf(list),i:0,wrong:[],right:0,tries:0,h:0,done:false};ask()}
function blanks(){var a=T.q[T.i].e,o="";for(var n=0;n<a.length;n++){var ch=a[n];o+=(ch==" ")?" ":(n<T.h?esc(ch):"_");if(ch!=" ")o+=" "}return o}
function ask(){if(T.i>=T.q.length)return fin();var w=T.q[T.i];T.tries=0;T.h=0;T.done=false;
V.innerHTML='<div class="bar"><span>'+(T.i+1)+' / '+T.q.length+'</span><span>💎 '+T.right+'</span></div><div class="box"><div class="ko">'+esc(w.k)+'</div><div class="bl" id="bl">'+blanks()+'</div><div class="msg" id="msg"></div></div><input id="in" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" placeholder="영어로 써봐!"><div class="row"><button class="b y" onclick="hint()">💡 힌트</button><button class="b g" id="ok" onclick="check()">확인</button></div>';
var inp=document.getElementById("in");inp.addEventListener("keydown",function(e){if(e.key==="Enter")check()});inp.focus()}
function hint(){if(T.done)return;var a=T.q[T.i].e;while(T.h<a.length&&a[T.h]==" ")T.h++;if(T.h<a.length)T.h++;document.getElementById("bl").innerHTML=blanks()}
function norm(x){return x.toLowerCase().replace(/\s+/g," ").trim()}
function check(){var ok=document.getElementById("ok");if(T.done){T.i++;return ask()}
var inp=document.getElementById("in"),m=document.getElementById("msg"),w=T.q[T.i];if(!inp.value.trim())return;
if(norm(inp.value)===norm(w.e)||(w.a||[]).some(function(x){return norm(x)===norm(inp.value)})){T.right++;T.done=true;m.style.color="var(--ok)";m.textContent="✅ 정답!";say(w.e);T.h=w.e.length;document.getElementById("bl").innerHTML=blanks();inp.disabled=true;ok.textContent="다음 ▶";setTimeout(function(){if(T.done&&T.q[T.i]===w){T.i++;ask()}},1100)}
else{T.tries++;if(T.tries>=2){T.done=true;T.wrong.push(w);m.style.color="var(--bad)";m.textContent="정답은 "+w.e;say(w.e);inp.disabled=true;ok.textContent="다음 ▶"}else{m.style.color="var(--bad)";m.textContent="❌ 다시 해봐!";inp.value="";inp.focus()}}}
function fin(){var n=T.q.length,r=T.right;V.innerHTML='<div class="box"><div class="ko">'+(T.wrong.length?"수고했어! 💪":"완벽해! 🎉")+'</div><div class="bl" style="letter-spacing:0">💎 '+r+' / '+n+'</div></div>'+(T.wrong.length?'<button class="b r" onclick="startTest(T.wrong)">🔁 틀린 것만 다시 ('+T.wrong.length+')</button>':'')+'<button class="b y" onclick="startTest(W)">✏️ 처음부터 다시</button><button class="b" onclick="home()">🏠 처음으로</button>'}
function parse(s){return s.split(/\n/).map(function(l){l=l.replace(/^\s*\d+\s*[.)]\s*/,"").trim();if(!l)return null;var alt=[];l=l.replace(/\(([A-Za-z' -]+)\)/g,function(_,a){alt.push(a.trim());return " "});var m=l.match(/[A-Za-z][A-Za-z' -]*[A-Za-z]|[A-Za-z]/);if(!m)return null;var ko=l.replace(m[0],"").replace(/[:：]/g," ").replace(/\s+/g," ").trim();return ko?{k:ko,e:m[0].trim(),a:alt}:null}).filter(Boolean)}
function edit(){V.innerHTML='<div class="box"><small>한 줄에 하나씩 붙여넣기<br>예: 사과 apple<br>예: 1. near : ~ 근처에</small></div><textarea id="ta">'+esc(W.map(function(w){return w.k+" "+w.e+(w.a&&w.a.length?" "+w.a.map(function(x){return "("+x+")"}).join(" "):"")}).join("\n"))+'</textarea><div class="msg" id="em"></div><button class="b g" onclick="save()">💾 저장하기</button><button class="b d" onclick="W=DEF;persist();edit()">기본 단어로</button><button class="b" onclick="home()">🏠 처음으로</button>'}
function persist(){try{localStorage.setItem("jjuni_words",JSON.stringify(W))}catch(e){}}
function save(){var p=parse(document.getElementById("ta").value),m=document.getElementById("em");if(!p.length){m.style.color="var(--bad)";m.textContent="단어를 못 찾았어요. 형식을 확인해 주세요.";return}W=p;persist();m.style.color="var(--ok)";m.textContent="✅ "+p.length+"개 저장됐어요!"}
home();
</script></body></html>
